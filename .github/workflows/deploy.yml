name: build-and-deploy
on: { push: { branches: [main] } }
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: npm test --prefix app
      - run: docker build -f docker/Dockerfile -t zero-downtime:${{ github.sha }} .
      - name: Security scan image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: zero-downtime:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare cluster
        run: |
          minikube status || minikube start --driver=docker
          minikube image load zero-downtime:${{ github.sha }}
          kubectl apply -f k8s/namespace.yaml -f k8s/blue-green/rollout.yaml -f k8s/services/active-service.yaml -f k8s/services/preview-service.yaml
          kubectl apply -f k8s/monitoring.yaml
      - name: Deploy green
        run: |
          kubectl -n deployment-engine set image deployment/green app=zero-downtime:${{ github.sha }}
          kubectl -n deployment-engine rollout status deployment/green --timeout=180s
      - name: Smoke test green
        run: |
          kubectl -n deployment-engine port-forward service/preview 18082:80 > /tmp/preview.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          sleep 3
          curl --fail --retry 5 http://127.0.0.1:18082/health
      - name: Promote green
        run: ./scripts/promote.sh green
      - name: Automatic rollback on failure
        if: failure()
        run: ./scripts/rollback.sh
