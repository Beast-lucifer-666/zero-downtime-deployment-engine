  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare cluster
        run: |
          minikube status || minikube start --driver=docker
          minikube image load zero-downtime:${{ github.sha }}
          kubectl apply -f k8s/namespace.yaml -f k8s/blue-green/rollout.yaml -f k8s/services/active-service.yaml -f k8s/services/preview-service.yaml
          kubectl apply -f k8s/monitoring.yaml
      - name: Deploy inactive color
        run: |
          TARGET=$(bash ./scripts/deploy-inactive.sh zero-downtime:${{ github.sha }})
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
      - name: Smoke test inactive color
        run: |
          SERVICE=preview
          [[ "$TARGET" == blue ]] && SERVICE=active
          kubectl -n deployment-engine port-forward service/$SERVICE 18082:80 > /tmp/preview.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          sleep 3
          curl --fail --retry 5 http://127.0.0.1:18082/health
      - name: Promote inactive color
        run: ./scripts/promote.sh "$TARGET"
      - name: Automatic rollback on failure
        if: failure()
        run: ./scripts/rollback.sh
