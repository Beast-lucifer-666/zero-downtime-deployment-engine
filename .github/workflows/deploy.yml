name: build-and-deploy
on: { push: { branches: [main] } }
jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: npm test --prefix app
      - run: docker build --no-cache -f docker/Dockerfile -t zero-downtime:${{ github.sha }} .
      - name: Security scan image
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sudo sh -s -- -b /usr/local/bin
          fi
          trivy image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL \
            zero-downtime:${{ github.sha }}
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Prepare cluster
        run: |
          minikube status || minikube start --driver=docker
          minikube image load zero-downtime:${{ github.sha }}
          kubectl apply -f k8s/namespace.yaml -f k8s/blue-green/rollout.yaml -f k8s/services/active-service.yaml -f k8s/services/preview-service.yaml
          kubectl apply -f k8s/monitoring.yaml
      - name: Deploy inactive color
        run: |
          TARGET=$(bash ./scripts/deploy-inactive.sh zero-downtime:${{ github.sha }} | tail -n 1)
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
      - name: Smoke test inactive color
        run: |
          kubectl -n deployment-engine port-forward deployment/$TARGET 18082:8080 > /tmp/preview.log 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          sleep 5
          curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:18082/health
      - name: Promote inactive color
        run: bash ./scripts/promote.sh "$TARGET"
      - name: Automatic rollback on failure
        if: failure()
        run: bash ./scripts/rollback.sh
