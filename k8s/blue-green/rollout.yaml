apiVersion: apps/v1
kind: Deployment
metadata: { name: blue, namespace: deployment-engine }
spec:
  replicas: 3
  selector: { matchLabels: { app: deployment-engine, color: blue } }
  template:
    metadata: { labels: { app: deployment-engine, color: blue } }
    spec:
      containers:
        - name: app
          image: zero-downtime:v1
          ports: [{ containerPort: 8080 }]
          env: [{ name: APP_VERSION, value: v1 }]
          readinessProbe: { httpGet: { path: /ready, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: green, namespace: deployment-engine }
spec:
  replicas: 3
  selector: { matchLabels: { app: deployment-engine, color: green } }
  template:
    metadata: { labels: { app: deployment-engine, color: green } }
    spec:
      containers:
        - name: app
          image: zero-downtime:v2
          ports: [{ containerPort: 8080 }]
          env: [{ name: APP_VERSION, value: v2 }]
          readinessProbe: { httpGet: { path: /ready, port: 8080 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
