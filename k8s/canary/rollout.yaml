apiVersion: apps/v1
kind: Deployment
metadata: { name: canary, namespace: deployment-engine }
spec:
  replicas: 1
  selector: { matchLabels: { app: deployment-engine, track: canary } }
  template:
    metadata: { labels: { app: deployment-engine, track: canary } }
    spec:
      containers:
        - name: app
          image: zero-downtime:v2
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /ready, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata: { name: canary, namespace: deployment-engine }
spec:
  selector: { app: deployment-engine, track: canary }
  ports: [{ port: 80, targetPort: 8080 }]
